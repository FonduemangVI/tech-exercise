---
# Root of everything Flux manages: every namespace folder under
# kubernetes/apps. Same pattern as home-ops, without SOPS (no secrets in
# Git here).
#
# Values that differ per deployment (registry name, client ID, hostname)
# come from the cluster-settings ConfigMap, created in flux-system at
# bootstrap by scripts/bootstrap-flux.sh.
#
# substituteFrom only reads from the Kustomization's own namespace, and the
# child Kustomizations live in their app namespaces (network, cert-manager).
# So this Kustomization reads the ConfigMap and its own substitution writes
# the values into each child's postBuild.substitute below. Add a variable
# here and in bootstrap-flux.sh together.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cluster-apps
  namespace: flux-system
spec:
  deletionPolicy: WaitForTermination
  interval: 1h
  path: ./kubernetes/apps
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
  postBuild:
    substituteFrom:
      - kind: ConfigMap
        name: cluster-settings
  patches:
    - # Defaults for all child Kustomizations
      patch: |-
        apiVersion: kustomize.toolkit.fluxcd.io/v1
        kind: Kustomization
        metadata:
          name: _
        spec:
          deletionPolicy: WaitForTermination
          postBuild:
            substitute:
              ACR_LOGIN_SERVER: ${ACR_LOGIN_SERVER}
              FLUX_CLIENT_ID: ${FLUX_CLIENT_ID}
              APP_DNS_LABEL: ${APP_DNS_LABEL}
              APP_HOSTNAME: ${APP_HOSTNAME}
          patches:
            - patch: |-
                apiVersion: helm.toolkit.fluxcd.io/v2
                kind: HelmRelease
                metadata:
                  name: _
                spec:
                  install:
                    crds: CreateReplace
                    strategy:
                      name: RetryOnFailure
                  rollback:
                    cleanupOnFail: true
                    recreate: true
                  upgrade:
                    cleanupOnFail: true
                    crds: CreateReplace
                    strategy:
                      name: RemediateOnFailure
                    remediation:
                      remediateLastFailure: true
                      retries: 2
              target:
                group: helm.toolkit.fluxcd.io
                kind: HelmRelease
      target:
        group: kustomize.toolkit.fluxcd.io
        kind: Kustomization
