---
# Two Kustomizations because the Gateway API and Envoy Gateway CRDs are
# installed by the HelmRelease: in one Kustomization the dry-run would fail
# on a fresh cluster.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway
spec:
  interval: 1h
  path: ./kubernetes/apps/network/envoy-gateway/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: true # cert-manager waits for the CRDs this installs
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: envoy-gateway-config
spec:
  dependsOn:
    - name: envoy-gateway
    - name: cert-manager-issuers # certificate.yaml uses letsencrypt-production
      namespace: cert-manager
  interval: 1h
  path: ./kubernetes/apps/network/envoy-gateway/config
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
