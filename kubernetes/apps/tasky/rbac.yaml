# W5: INTENTIONAL WEAKNESS, required by the brief ("container has
# cluster-wide admin role"). See docs/risk-register.md.
#
# Managed by Flux (kubernetes/apps/tasky/kustomization.yaml), not by app.yml:
# the app pipeline only has rights in the tasky namespace and cannot create
# cluster-wide bindings. Being in Git, the weakness is visible and reviewed.
#
# Fix: delete this binding; the app needs no Kubernetes API access at all.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tasky-cluster-admin-w5
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: tasky-sa
    namespace: tasky
