apiVersion: v1
kind: ServiceAccount
metadata:
  name: tasky-sa
  namespace: tasky
  annotations:
    # Workload identity: id-tasky (Key Vault Secrets User), federated with
    # system:serviceaccount:tasky:tasky-sa in infra/workload_identity.tf
    azure.workload.identity/client-id: ${TASKY_CLIENT_ID}
