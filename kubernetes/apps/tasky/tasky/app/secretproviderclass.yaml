# Pulls tasky's secrets from Key Vault with workload identity (id-tasky) and
# syncs them into the Kubernetes Secret "tasky-secrets", which the
# deployment reads as env vars (R15). The sync only happens while a pod
# mounts the CSI volume.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: tasky-kv
  namespace: tasky
spec:
  provider: azure
  parameters:
    clientID: ${TASKY_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${AZURE_TENANT_ID}
    objects: |
      array:
        - |
          objectName: mongo-app-uri
          objectType: secret
        - |
          objectName: tasky-jwt-secret
          objectType: secret
  secretObjects:
    - secretName: tasky-secrets
      type: Opaque
      data:
        - objectName: mongo-app-uri
          key: MONGODB_URI
        - objectName: tasky-jwt-secret
          key: SECRET_KEY
