# R18: exposed through the Kubernetes ingress layer (Gateway API, Envoy
# Gateway) and the Azure load balancer. HTTPS only; the Gateway's port 80
# listener just redirects. If Gateway API is not accepted, the fallback is
# an Ingress resource with Traefik.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: tasky
  namespace: tasky
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https
  hostnames:
    - ${APP_HOSTNAME}
  rules:
    - backendRefs:
        - name: tasky
          port: 80
