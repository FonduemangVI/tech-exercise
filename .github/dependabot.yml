version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /infra
      - /infra/bootstrap
    schedule:
      interval: weekly

  - package-ecosystem: gomod
    directory: /app
    schedule:
      interval: weekly

  # Not docker: the Dockerfile's FROM lines are build arguments (base images
  # come from ACR), which Dependabot cannot resolve. Base image tags are
  # bumped in scripts/import-images.sh and app/Dockerfile together.
