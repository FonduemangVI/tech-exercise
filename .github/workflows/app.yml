name: app

# R23: build the tasky container, push it to ACR and deploy it to AKS.
# R25: Trivy gates the image and the manifests before anything is pushed.
#
# Pull requests build and scan with the read-only identity (no push).
# Only main, through the prod-app environment, pushes and deploys.
# No path filter on PRs, so the checks can be required (see infra.yml).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "kubernetes/apps/tasky/**"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false # never cancel a running deploy

env:
  TRIVY_VERSION: "0.76.1"
  IMAGE_REPOSITORY: tasky

jobs:
  manifests:
    name: Scan manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Install Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/$checksums"
          grep " ${tarball}$" "$checksums" | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      # Two steps because --severity also filters the report: with only
      # HIGH,CRITICAL, lower findings are hidden, not just let through.
      # The first step shows everything, including W5 (KSV-0111, MEDIUM,
      # the cluster-admin binding), and never fails. The second is the gate.
      - name: Trivy Kubernetes manifest report (all severities)
        run: trivy config --exit-code 0 kubernetes

      - name: Trivy Kubernetes manifest gate (HIGH and CRITICAL)
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL kubernetes

  build:
    name: Build and scan image
    needs: manifests
    # PRs from this repo only (forks cannot get an OIDC token), and only
    # once the app variables exist (scripts/set-app-vars.sh).
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      vars.AZURE_CLIENT_ID_PR != '' && vars.ACR_LOGIN_SERVER != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/tasky:pr-${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # id-gh-pr: AcrPull only, to pull the base images
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_PR }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build
        run: docker build --build-arg REGISTRY="${{ vars.ACR_LOGIN_SERVER }}" -t "$IMAGE" app

      # R16: the image must contain wizexercise.txt with my name
      - name: Check wizexercise.txt
        run: docker run --rm --entrypoint cat "$IMAGE" /app/wizexercise.txt | grep -qx "Michael Thomas"

      - name: Install Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/$checksums"
          grep " ${tarball}$" "$checksums" | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      # Report every finding (never fails), then the gate: HIGH or CRITICAL
      # with a fix available. Two steps because --severity also hides lower
      # findings from the report.
      - name: Trivy image report (all severities)
        run: trivy image --exit-code 0 "$IMAGE"

      - name: Trivy image gate (HIGH and CRITICAL, fixable)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --skip-db-update "$IMAGE"

  # Decides whether main has anything to deploy, before any approval is
  # asked for. Compares this commit with the last successful prod-app
  # deployment (GitHub records one per environment job) over the two paths
  # that make up the app: its source and its manifests. A workflow-only
  # change (a tool bump) deploys nothing. Manual runs always deploy.
  #
  # The image tag is the git tree hash of app/: the same source always gives
  # the same tag, so a manifest-only change reuses the image and an
  # unchanged app is never rebuilt or restarted.
  changes:
    name: Check for changes
    needs: manifests
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: read
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      image_tag: ${{ steps.check.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # needs the last deployed commit for the diff

      - name: Compare with the last deployment
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          paths=(app kubernetes/apps/tasky/tasky/app)
          echo "image_tag=$(git rev-parse HEAD:app)" >> "$GITHUB_OUTPUT"

          # Newest first; the first deployment whose latest status is success
          last=""
          for id in $(gh api "repos/$REPO/deployments?environment=prod-app&per_page=30" --jq '.[].id'); do
            if [[ "$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""')" == success ]]; then
              last="$(gh api "repos/$REPO/deployments/$id" --jq .sha)"
              break
            fi
          done

          if [[ "$EVENT" == workflow_dispatch ]]; then
            deploy=true reason="manual run"
          elif [[ -z "$last" ]] || ! git cat-file -e "$last^{commit}" 2>/dev/null; then
            deploy=true reason="no previous successful deployment found"
          elif git diff --quiet "$last" HEAD -- "${paths[@]}"; then
            deploy=false reason="no change to ${paths[*]} since ${last:0:7}"
          else
            deploy=true reason="changes since ${last:0:7}"
          fi

          echo "deploy=$deploy" >> "$GITHUB_OUTPUT"
          {
            echo "### Deploy: $deploy ($reason)"
            if [[ "$deploy" == true && -n "$last" ]] && git cat-file -e "$last^{commit}" 2>/dev/null; then
              echo '```'
              git diff --stat "$last" HEAD -- "${paths[@]}"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Build, push and deploy
    needs: changes
    if: >-
      needs.changes.outputs.deploy == 'true' &&
      vars.AZURE_CLIENT_ID_APP != '' && vars.ACR_LOGIN_SERVER != ''
    runs-on: ubuntu-latest
    environment: prod-app # approval; only main can deploy
    permissions:
      contents: read
      id-token: write
    env:
      IMAGE: ${{ vars.ACR_LOGIN_SERVER }}/tasky:${{ needs.changes.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # id-gh-app: AcrPush, command invoke, Kubernetes rights in tasky only
      - uses: azure/login@v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID_APP }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: az acr login --name "${{ vars.ACR_NAME }}"

      # Same source, same tag: if ACR already has it, reuse it (a
      # manifest-only change). Tags are never overwritten.
      - name: Check for an existing image
        id: image
        run: |
          if az acr manifest show-metadata --registry "${{ vars.ACR_NAME }}" \
              --name "tasky:${{ needs.changes.outputs.image_tag }}" --only-show-errors >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Image already in ACR: reusing it, no build" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.image.outputs.exists != 'true'
        run: docker build --build-arg REGISTRY="${{ vars.ACR_LOGIN_SERVER }}" -t "$IMAGE" app

      # R16: the image must contain wizexercise.txt with my name
      - name: Check wizexercise.txt
        if: steps.image.outputs.exists != 'true'
        run: docker run --rm --entrypoint cat "$IMAGE" /app/wizexercise.txt | grep -qx "Michael Thomas"

      - name: Install Trivy
        run: |
          set -euo pipefail
          base="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}"
          tarball="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          checksums="trivy_${TRIVY_VERSION}_checksums.txt"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/$checksums"
          grep " ${tarball}$" "$checksums" | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy

      # Same report and gate as the PR, on a new build or on the reused image
      # (pulled from ACR): vulnerabilities found since it was pushed still
      # stop the deploy. Nothing is pushed unless the gate passes.
      - name: Trivy image report (all severities)
        run: trivy image --exit-code 0 "$IMAGE"

      - name: Trivy image gate (HIGH and CRITICAL, fixable)
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --skip-db-update "$IMAGE"

      - name: Push
        if: steps.image.outputs.exists != 'true'
        run: docker push "$IMAGE"

      - name: Render manifests
        env:
          TASKY_CLIENT_ID: ${{ vars.TASKY_CLIENT_ID }}
          KEY_VAULT_NAME: ${{ vars.KEY_VAULT_NAME }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          APP_HOSTNAME: ${{ vars.APP_HOSTNAME }}
        run: |
          set -euo pipefail
          mkdir -p rendered
          # Only the listed variables are substituted; anything else that
          # looks like ${...} is left alone.
          # shellcheck disable=SC2016 # literal: the list of variables envsubst may replace
          vars='${IMAGE} ${TASKY_CLIENT_ID} ${KEY_VAULT_NAME} ${AZURE_TENANT_ID} ${APP_HOSTNAME}'
          for f in kustomization.yaml serviceaccount.yaml secretproviderclass.yaml \
                   deployment.yaml service.yaml httproute.yaml; do
            envsubst "$vars" < "kubernetes/apps/tasky/tasky/app/$f" > "rendered/$f"
          done
          # shellcheck disable=SC2016 # literal: look for any ${ left unreplaced
          if grep -n '\${' rendered/*.yaml; then
            echo "Unsubstituted variables left in the manifests" >&2
            exit 1
          fi

      # command invoke runs kubectl inside the cluster as id-gh-app, so the
      # pipeline needs no network path to the API server and Kubernetes RBAC
      # still limits it to the tasky namespace.
      - name: Deploy
        working-directory: rendered
        run: |
          set -euo pipefail
          result="$(az aks command invoke \
            --resource-group "${{ vars.AKS_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_NAME }}" \
            --file . \
            --command "kubectl apply -k . && kubectl -n tasky rollout status deploy/tasky --timeout=180s" \
            --output json)"
          echo "$result" | jq -r '.logs'
          exit "$(echo "$result" | jq -r '.exitCode')"
